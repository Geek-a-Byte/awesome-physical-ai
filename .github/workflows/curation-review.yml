name: Curation review

on:
  schedule:
    # 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-monthly-review-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Compute current month tag
        id: month
        shell: bash
        run: echo "tag=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Create curation review issue (idempotent)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          MONTH_TAG: ${{ steps.month.outputs.tag }}
        with:
          script: |
            const monthTag = process.env.MONTH_TAG;
            const titlePrefix = 'Curation review — ';
            const title = `${titlePrefix}${monthTag}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Keep exactly one curation review open at a time.
            //
            // A review still open when the next cycle comes round is the review that
            // needs finishing; opening a second issue over it grows the queue without
            // adding information. So: skip creation, and leave a dated note on the
            // open review instead.
            //
            // Listed rather than searched: the search index is eventually consistent
            // and can miss a recently created issue, which would defeat the guard.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'curation',
              per_page: 100,
            });
            const reviews = openIssues
              .filter(i => !i.pull_request && i.title.startsWith(titlePrefix))
              .sort((a, b) => a.number - b.number);

            const currentMonth = reviews.find(i => i.title === title);
            if (currentMonth) {
              core.info(`Review for ${monthTag} already open: #${currentMonth.number}`);
              return;
            }

            const openReview = reviews[0];
            if (openReview) {
              // One note per cycle, so manual workflow_dispatch re-runs stay quiet.
              const marker = `<!-- curation-review-cycle:${monthTag} -->`;
              const priorComments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: openReview.number,
                per_page: 100,
              });
              if (priorComments.some(c => (c.body || '').includes(marker))) {
                core.info(`Cycle ${monthTag} already noted on #${openReview.number}.`);
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: openReview.number,
                body: `${marker}\nThe ${monthTag} cycle opened while this review is still in progress. No new issue created — this remains the active review.`,
              });
              core.info(`Noted cycle ${monthTag} on #${openReview.number}; skipped creation.`);
              return;
            }

            const body = [
              `Scheduled monthly curation review for **${monthTag}**.`,
              ``,
              `Run the full review process documented in [\`REVIEW.md\`](https://github.com/${owner}/${repo}/blob/main/REVIEW.md) (local copy; gitignored) or the [Review process](https://natnew.github.io/awesome-physical-ai/docs/workflow-review) docs page. Submit all changes in a single PR titled \`Curation review: ${monthTag}\`.`,
              ``,
              `### Pre-flight`,
              ``,
              `- [ ] Run \`python scripts/check_entry_counts.py\` from the repo root. Fix any category outside [15, 25] before continuing.`,
              `- [ ] Confirm latest \`link-check\` run on \`main\` is green; otherwise resolve link issues first.`,
              ``,
              `### Categories`,
              ``,
              `Work through the [curation standards](https://natnew.github.io/awesome-physical-ai/docs/curation-standards) and the staleness criteria in \`REVIEW.md\` for each category:`,
              ``,
              `- [ ] Simulators`,
              `- [ ] Datasets`,
              `- [ ] Benchmarks`,
              `- [ ] Evaluation Methodology`,
              `- [ ] Robotics Foundation Models`,
              `- [ ] World Models`,
              `- [ ] Manipulation`,
              `- [ ] Locomotion`,
              `- [ ] Sim-to-Real`,
              `- [ ] Safety & Robustness`,
              `- [ ] Governance & Policy`,
              `- [ ] Production Patterns`,
              `- [ ] Courses`,
              `- [ ] Companies`,
              ``,
              `### Notes`,
              ``,
              `_Use this section for known issues, categories of concern, or context for this review pass._`,
              ``,
              `---`,
              ``,
              `Opened automatically by \`.github/workflows/curation-review.yml\`.`,
            ].join('\n');

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['curation', 'maintenance'],
            });
            core.info(`Created issue #${created.data.number}: ${created.data.html_url}`);
